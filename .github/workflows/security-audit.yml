name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  static-binary-audit:
    name: Static Binary Security Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsodium-dev \
          libargon2-dev \
          cmake \
          build-essential \
          binutils \
          strace

    - name: Build static binary
      run: |
        mkdir build-static
        cd build-static
        cmake .. -DBUILD_STATIC_CLI=ON -DCMAKE_BUILD_TYPE=Release
        make VERBOSE=1
        ls -lh minicrypto

    - name: Verify static linking
      run: |
        cd build-static
        echo "━━━ Checking dynamic dependencies ━━━"
        if ldd minicrypto 2>&1 | grep -v "not a dynamic executable"; then
          echo "[FAIL] FAIL: Binary has dynamic dependencies!"
          ldd minicrypto
          exit 1
        else
          echo "[PASS] PASS: Binary is fully static"
        fi

    - name: Check for network symbols
      run: |
        cd build-static
        echo "━━━ Checking for network symbols ━━━"
        NETWORK_SYMBOLS=$(nm minicrypto | grep -iE 'socket|connect|bind|listen|accept|recv|send|getaddrinfo|gethostbyname' || true)

        if [ -n "$NETWORK_SYMBOLS" ]; then
          echo "[FAIL] FAIL: Network symbols found!"
          echo "$NETWORK_SYMBOLS"
          exit 1
        else
          echo "[PASS] PASS: No network symbols found"
        fi

    - name: Check for forbidden syscalls
      run: |
        cd build-static
        echo "━━━ Testing for network syscalls ━━━"

        # Create test file
        echo "test data" > test_input.txt

        # Run with strace and filter network calls
        NETWORK_CALLS=$(printf 'test_password\ntest_password\nn\n' | \
          timeout 10 strace -e trace=network,socket,connect,bind,listen,accept,sendto,recvfrom,sendmsg,recvmsg \
          ./minicrypto lock test_input.txt -o test_output.mcc 2>&1 || true)

        # Check if any network calls were made
        if echo "$NETWORK_CALLS" | grep -qE 'socket|connect|bind|listen|accept|send|recv'; then
          echo "[FAIL] FAIL: Network syscalls detected!"
          echo "$NETWORK_CALLS"
          exit 1
        else
          echo "[PASS] PASS: No network syscalls detected"
        fi

    - name: Check for time dependencies
      run: |
        cd build-static
        echo "━━━ Checking time dependencies ━━━"

        # Check for NTP/time-sync symbols
        TIME_SYMBOLS=$(nm minicrypto | grep -iE 'ntp|timeserver|clock_gettime|gettimeofday' || true)

        # clock_gettime is OK (used for benchmarking/timestamps)
        # but NTP/timeserver is NOT OK
        if echo "$TIME_SYMBOLS" | grep -iE 'ntp|timeserver'; then
          echo "[FAIL] FAIL: Time synchronization dependencies found!"
          echo "$TIME_SYMBOLS"
          exit 1
        else
          echo "[PASS] PASS: No time sync dependencies"
        fi

    - name: Verify encryption works offline
      run: |
        cd build-static
        echo "━━━ Testing offline operation ━━━"

        # Disable network entirely using unshare
        echo "test data for offline check" > offline_test.txt

        sudo unshare -n sh -c "
          echo 'test_password' | ./minicrypto lock offline_test.txt -o offline_test.mcc 2>/dev/null || true
          ./minicrypto test 2>&1 | head -20
        "

        if [ -f offline_test.mcc ]; then
          echo "[PASS] PASS: Encryption works without network"
        else
          echo "[FAIL] FAIL: Encryption failed in network-isolated environment"
          exit 1
        fi

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Check allowed dependencies
      run: |
        echo "━━━ Checking dependencies ━━━"

        # List of allowed dependencies (must be audited crypto libraries)
        ALLOWED_DEPS="libsodium libargon2 libc libpthread libm"

        # Extract dependencies from CMakeLists.txt
        FOUND_DEPS=$(grep -oP 'pkg_check_modules.*REQUIRED \K[a-z0-9_-]+' CMakeLists.txt || true)

        echo "Found dependencies: $FOUND_DEPS"

        for dep in $FOUND_DEPS; do
          if ! echo "$ALLOWED_DEPS" | grep -q "$dep"; then
            echo "[FAIL] FAIL: Unexpected dependency: $dep"
            echo "Only allowed: $ALLOWED_DEPS"
            exit 1
          fi
        done

        echo "[PASS] PASS: All dependencies are whitelisted"

    - name: Check for telemetry code
      run: |
        echo "━━━ Checking for telemetry ━━━"

        TELEMETRY_PATTERNS="analytics|telemetry|metrics|tracking|sentry|bugsnag|crashlytics"

        if grep -riE "$TELEMETRY_PATTERNS" --include="*.cpp" --include="*.h" .; then
          echo "[FAIL] FAIL: Potential telemetry code found!"
          exit 1
        else
          echo "[PASS] PASS: No telemetry code detected"
        fi

    - name: Check for hardcoded secrets
      run: |
        echo "━━━ Checking for hardcoded secrets ━━━"

        # Check for potential API keys, tokens, etc.
        if grep -riE '(api[_-]?key|secret[_-]?key|auth[_-]?token|password\s*=\s*["\x27])' \
               --include="*.cpp" --include="*.h" \
               --exclude="*test*" \
               --exclude="*example*" .; then
          echo "[WARNING]  WARNING: Potential hardcoded secrets found"
          echo "Please verify these are test data only"
        else
          echo "[PASS] PASS: No hardcoded secrets found"
        fi

  format-version-check:
    name: File Format Version Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Verify format versioning
      run: |
        echo "━━━ Checking format versioning ━━━"

        # Check that format.h defines version
        if ! grep -q "constexpr uint8_t VERSION" core/format.h; then
          echo "[FAIL] FAIL: VERSION constant not found in format.h"
          exit 1
        fi

        # Extract version
        VERSION=$(grep "constexpr uint8_t VERSION" core/format.h | grep -oP '\d+')
        echo "Current format version: $VERSION"

        # Check that domain separation strings include version
        DOMAIN_STRINGS=$(grep -oP 'MINICRYPTO::[A-Z_]+::v\d+' core/keygen.h || true)

        if [ -z "$DOMAIN_STRINGS" ]; then
          echo "[FAIL] FAIL: Domain separation strings must include version (::v1, ::v2, etc.)"
          exit 1
        fi

        echo "Found domain strings:"
        echo "$DOMAIN_STRINGS"
        echo "[PASS] PASS: Format versioning is properly implemented"

    - name: Check version compatibility
      run: |
        echo "━━━ Checking version handling ━━━"

        # Verify that decrypt checks version
        if ! grep -q "validate_header" core/crypto.cpp; then
          echo "[FAIL] FAIL: No header validation in decryption"
          exit 1
        fi

        echo "[PASS] PASS: Version validation present"

  memory-safety-check:
    name: Memory Safety Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Check for unsafe operations
      run: |
        echo "━━━ Checking for unsafe memory operations ━━━"

        # Check for banned functions
        BANNED_FUNCS="strcpy|strcat|sprintf|gets|strncpy"

        if grep -rnE "\b($BANNED_FUNCS)\(" --include="*.cpp" --include="*.h" .; then
          echo "[FAIL] FAIL: Unsafe C functions found!"
          echo "Use safe alternatives (std::string, snprintf, etc.)"
          exit 1
        else
          echo "[PASS] PASS: No unsafe C functions found"
        fi

    - name: Check secure zeroization
      run: |
        echo "━━━ Checking secure memory zeroization ━━━"

        # Verify that sodium_memzero is used for sensitive data
        if ! grep -rq "sodium_memzero" core/; then
          echo "[FAIL] FAIL: No secure zeroization found"
          exit 1
        fi

        # Check that destructors zero memory
        if ! grep -A5 "~SecureBuffer\|~SecureString" core/secure_memory.cpp | grep -q "sodium_memzero"; then
          echo "[WARNING]  WARNING: Destructors should call sodium_memzero"
        else
          echo "[PASS] PASS: Secure zeroization implemented"
        fi

  documentation-check:
    name: Security Documentation Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Verify security documentation exists
      run: |
        echo "━━━ Checking security documentation ━━━"

        REQUIRED_DOCS="docs/SECURITY.md DETERMINISTIC_WARN.txt FAQ.md"

        for doc in $REQUIRED_DOCS; do
          if [ ! -f "$doc" ]; then
            echo "[FAIL] FAIL: Missing required document: $doc"
            exit 1
          fi
        done

        echo "[PASS] PASS: All required security docs present"

    - name: Check deterministic mode warnings
      run: |
        echo "━━━ Verifying deterministic mode warnings ━━━"

        # CLI must show warning
        if ! grep -q "DETERMINISTIC.*WARNING" ui_cli/main.cpp; then
          echo "[FAIL] FAIL: No deterministic warning in CLI"
          exit 1
        fi

        # API must require confirmation
        if ! grep -q "deterministic_confirm_callback" core/crypto.h; then
          echo "[FAIL] FAIL: No confirmation callback in API"
          exit 1
        fi

        echo "[PASS] PASS: Deterministic warnings implemented"

  build-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [static-binary-audit, dependency-audit, format-version-check, memory-safety-check, documentation-check]

    steps:
    - name: Security audit summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "[PASS] SECURITY AUDIT PASSED"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "[v] Static binary has no dynamic dependencies"
        echo "[v] No network symbols or syscalls detected"
        echo "[v] Works completely offline"
        echo "[v] Only whitelisted dependencies (libsodium, libargon2)"
        echo "[v] No telemetry code"
        echo "[v] Format versioning implemented"
        echo "[v] Memory safety checks passed"
        echo "[v] Secure zeroization implemented"
        echo "[v] Security documentation complete"
        echo "[v] Deterministic mode warnings in place"
        echo ""
        echo "Binary is ready for air-gapped deployment."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
