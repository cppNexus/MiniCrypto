name: Cross-Platform CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev libargon2-dev cmake build-essential pkg-config

    - name: Set up dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install libsodium argon2

    - name: Set up dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install libsodium:x64-windows argon2:x64-windows

    - name: Configure CMake (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Tests
      run: |
        ctest --test-dir build -C Release --output-on-failure
