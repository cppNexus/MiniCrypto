name: Release Build

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: debian12-x86_64
            container_image: debian:bookworm-slim
            distro: debian
          - os: ubuntu-latest
            platform: rocky9-x86_64
            container_image: rockylinux:9
            distro: rocky
          - os: ubuntu-latest
            platform: archlinux-x86_64
            container_image: archlinux:latest
            distro: arch
          - os: macos-latest
            platform: macos
            container_image: ''
            distro: ''
          - os: windows-latest
            platform: windows-x86_64
            container_image: ''
            distro: ''

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.container_image == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libargon2-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libsodium argon2

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg install libsodium:x64-windows argon2:x64-windows

      - name: Build and test in Linux distribution image
        if: matrix.container_image != ''
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "${{ matrix.container_image }}" \
            /bin/sh -ec '
              case "${{ matrix.distro }}" in
                debian)
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                    build-essential cmake pkg-config libsodium-dev libargon2-dev
                  ;;
                rocky)
                  dnf install -y dnf-plugins-core epel-release
                  dnf config-manager --set-enabled crb
                  dnf install -y cmake gcc-c++ make pkgconf-pkg-config libsodium-devel argon2-devel
                  ;;
                arch)
                  pacman -Syu --noconfirm --needed base-devel cmake pkgconf libsodium argon2
                  ;;
              esac
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
              cmake --build build --parallel
              ctest --test-dir build --output-on-failure
            '

      - name: Configure Release build (Linux/macOS)
        if: runner.os != 'Windows' && matrix.container_image == ''
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Configure Release build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Release
        if: matrix.container_image == ''
        run: cmake --build build --config Release --parallel

      - name: Run tests
        if: matrix.container_image == ''
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package release (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp build/minicrypto README.md LICENSE package/
          tar -C package -czf "minicrypto-${{ matrix.platform }}-${GITHUB_SHA::12}.tar.gz" .

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/minicrypto.exe package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "minicrypto-${{ matrix.platform }}-$($env:GITHUB_SHA.Substring(0,12)).zip"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: minicrypto-${{ matrix.platform }}
          path: minicrypto-${{ matrix.platform }}-*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: minicrypto-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
